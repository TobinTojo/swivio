# Render static site blueprint
# Docs: https://render.com/docs/static-sites
#
# In the Render dashboard: New → Static Site → connect repo
# Or use this blueprint via render.yaml

services:
  - type: web
    name: swivio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
